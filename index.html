<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Beard Detection AI - Upload Image</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    img { max-width: 300px; margin-top: 10px; border: 1px solid #ccc; }
    #label-container div { font-size: 1.2em; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Beard Detection AI</h1>
  <input type="file" id="image-upload" accept="image/*">
  <div id="image-container"></div>
  <div id="label-container"></div>

  <script>
    const URL = "tm-my-image-model/"; // Folder name for your model
    let model, maxPredictions;

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();
      console.log("Model loaded!");
    }

    // Run initialization
    init();

    // Handle file upload
    document.getElementById("image-upload").addEventListener("change", async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.onload = async function() {
        document.getElementById("image-container").innerHTML = "";
        document.getElementById("image-container").appendChild(img);

        const prediction = await model.predict(img);
        const labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const div = document.createElement("div");
          div.innerText = prediction[i].className + ": " + (prediction[i].probability*100).toFixed(2) + "%";
          labelContainer.appendChild(div);
        }
      };
    });
  </script>
</body>
</html>
