<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Beard Detection AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    video, canvas { border: 1px solid #ccc; margin-top: 10px; }
    #label-container div { font-size: 1.2em; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Beard Detection AI</h1>
  <button onclick="init()">Start Camera</button>
  <div id="webcam-container"></div>
  <div id="label-container"></div>

  <script>
    const URL = "tm-my-image-model/"; // Must match your model folder name

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
      // Load the model and metadata
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      // Setup webcam
      const flip = true; // flip horizontally
      webcam = new tmImage.Webcam(200, 200, flip);
      await webcam.setup(); 
      await webcam.play();
      window.requestAnimationFrame(loop);

      // Attach webcam to page
      document.getElementById("webcam-container").appendChild(webcam.canvas);

      // Setup labels
      labelContainer = document.getElementById("label-container");
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
    }

    async function loop() {
      webcam.update(); // update webcam frame
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.childNodes[i].innerHTML =
          prediction[i].className + ": " + (prediction[i].probability*100).toFixed(2) + "%";
      }
    }
  </script>
</body>
</html>
